[package]
name = "icecream-watcher"
description = "Terminal monitor for Icecream (icecc) distributed compile clusters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "icecream-watcher"
path = "src/main.rs"

[dependencies]
icecc-proto = { workspace = true }
icecc-model = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
clap = { version = "4", features = ["derive", "env"] }
